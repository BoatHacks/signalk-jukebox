name: publish
on: { release: { types: [published] } }
permissions:
  contents: read
  id-token: write # enables npm OIDC trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      - run: npm publish
