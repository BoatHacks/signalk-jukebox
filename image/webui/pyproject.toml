[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "Mopidy-Jukebox-WebUI"
version = "0.1.0"
description = "Minimal built-in playback UI for signalk-jukebox, until Mopidy-Iris supports Mopidy 4.x"
requires-python = ">=3.11"
dependencies = ["Mopidy>=4.0.0"]

[project.entry-points."mopidy.ext"]
jukebox = "jukebox_webui:Extension"

[tool.setuptools.packages.find]
include = ["jukebox_webui*"]

[tool.setuptools.package-data]
jukebox_webui = ["static/*"]
