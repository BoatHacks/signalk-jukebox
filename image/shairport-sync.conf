// shairport-sync config (SPEC.md §6.4). Default install path
// (/usr/local/etc/shairport-sync.conf, confirmed via --help) -- picked up
// automatically, no --configfile= flag needed on the CLI Snapcast's own
// airplay_stream.cpp constructs.
//
// output_rate belongs under the "stdout" backend's own section, not
// "general" -- confirmed against shairport-sync's own scripts/
// shairport-sync.conf template (its `--help` CLI text saying "There are
// no settings or options for the audio backend 'stdout'" is misleading;
// the config file supports more than the CLI help documents).
//
// Forced to 44100, not left at its own default: shairport-sync 5.x
// defaults output_rate to 48000 when a client negotiates AirPlay 2, but
// Snapcast's stream_manager.cpp unconditionally overwrites any
// `sampleformat=` URI parameter to 44100:16:2 for every airplay-type
// stream (confirmed against Snapcast's own source, streamUri.query[
// kUriSampleFormat] = "44100:16:2") -- there is no way to raise
// Snapcast's side to 48000 instead, so shairport-sync's actual output has
// to be pinned to 44100 to match what Snapserver assumes it's reading.
// Left unset, this mismatch reads real 48000 Hz PCM as if it were
// 44100 Hz -- confirmed live to sound like rhythmic static on a real
// speaker.
stdout =
{
  output_rate = 44100;
};
